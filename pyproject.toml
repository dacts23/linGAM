[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magli"
version = "0.3.0"
description = "magli (Modelo Aditivo Generalizado Lineal) — Modern Pythonic Generalized Additive Models (GAMs) with Eilers-Marx (1996) and Wood (2011) backends"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    {name = "David Ávila Cortés"}
]
keywords = ["gam", "generalized-additive-models", "splines", "regression", "machine-learning", "magli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
docs = [
    "sphinx>=9",
    "furo",
    "sphinx-copybutton",
]

[project.urls]
Homepage = "https://github.com/dacts23/magli"
Repository = "https://github.com/dacts23/magli"
Documentation = "https://dacts23.github.io/magli/"

[tool.setuptools.packages.find]
where = ["src"]

